services:
  mongodb:
    image: mongo:7.0
    restart: always
    container_name: readme_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: test
    ports:
      - 27020:27017
    volumes:
      - readme_mongodb_data:/data/db

  mongo-express:
    image: mongo-express:1.0.0-alpha.4
    restart: always
    container_name: readme_mongo_express
    ports:
      - 8082:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: test
      ME_CONFIG_MONGODB_URL: mongodb://admin:test@mongodb:27017/
    depends_on:
      - mongodb

volumes:
  readme_mongodb_data:
